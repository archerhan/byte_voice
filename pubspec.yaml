name: byte_voice
description: "离线语音转文字笔记应用 | Byte Voice"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.0
  drift: ^2.34.0
  path_provider: ^2.1.6
  path: ^1.9.1
  record: ^7.1.0
  desktop_drop: ^0.7.1
  file_selector: ^1.1.0
  file_selector_platform_interface: ^2.7.0
  flutter_local_notifications: ^22.0.1
  audioplayers: ^6.8.0
  uuid: ^4.5.3
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  sherpa_onnx: ^1.13.3
  logger: ^2.7.0
  archive: ^3.6.1
  shadcn_ui: ^0.55.0
  flutter_animate: ^4.5.2
  skeletonizer: ^2.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
